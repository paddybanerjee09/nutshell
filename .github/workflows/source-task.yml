name: Source task validation

on:
  pull_request_target:
    branches: [main]
    types: [opened, reopened, synchronize, edited, ready_for_review]

permissions:
  contents: read
  pull-requests: read
  statuses: write

concurrency:
  group: source-task-${{ github.event.pull_request.number }}
  cancel-in-progress: true

jobs:
  source-task:
    # GitHub assigns the PR number at open. The next push binds that number in CURRENT_TASK.
    if: github.event.action != 'opened' || github.event.pull_request.draft == false
    runs-on: ubuntu-24.04
    timeout-minutes: 10
    steps:
      - name: Reject pull requests from other repositories
        if: github.event.pull_request.head.repo.id != github.event.repository.id || github.event.pull_request.base.repo.id != github.event.repository.id
        run: |
          echo '::error::Source task validation requires a same-repository pull request.'
          exit 1

      - name: Check out the trusted base commit
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          ref: ${{ github.sha }}
          persist-credentials: false

      - name: Fetch candidate Git objects
        shell: bash
        env:
          PR_NUMBER: ${{ github.event.pull_request.number }}
          PR_BASE_SHA: ${{ github.event.pull_request.base.sha }}
          PR_HEAD_SHA: ${{ github.event.pull_request.head.sha }}
          GITHUB_TOKEN: ${{ github.token }}
        run: |
          if [[ ! "$PR_NUMBER" =~ ^[1-9][0-9]*$ || ! "$PR_HEAD_SHA" =~ ^[a-f0-9]{40}$ ]]; then
            echo '::error::Invalid pull request number or commit SHA.'
            exit 1
          fi
          if [[ "$(git rev-parse --verify HEAD)" != "$PR_BASE_SHA" ]]; then
            echo '::error::The trusted checkout does not match the pull request base.'
            exit 1
          fi

          basic_auth="$(printf 'x-access-token:%s' "$GITHUB_TOKEN" | base64 -w0)"
          echo "::add-mask::$basic_auth"
          export GIT_AUTH_HEADER="AUTHORIZATION: basic $basic_auth"
          if ! git --config-env=http.https://github.com/.extraheader=GIT_AUTH_HEADER \
            fetch --no-tags --no-recurse-submodules --depth=1 origin "refs/pull/${PR_NUMBER}/head" ||
            [[ "$(git rev-parse --verify 'FETCH_HEAD^{commit}')" != "$PR_HEAD_SHA" ]]; then
            echo 'The candidate head changed or is unavailable. The validator will confirm the current pull request before reading snapshots.'
          fi

      - name: Set up Node.js
        uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7.1.0
        with:
          node-version-file: .node-version
          package-manager-cache: false

      - name: Set up pnpm
        uses: pnpm/action-setup@ea17c68df8912ef543352723c149a84f56e3d413 # v6.1.0
        with:
          run_install: false

      - name: Install trusted dependencies
        run: pnpm install --frozen-lockfile --ignore-scripts

      # The Actions run belongs to the base SHA. The CLI posts the result to the verified PR head.
      - name: Validate and publish the candidate status
        env:
          GITHUB_TOKEN: ${{ github.token }}
        run: node packages/cli/src/source-check.ts
